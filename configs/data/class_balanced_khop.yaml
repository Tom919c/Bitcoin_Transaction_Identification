data:
  raw_db: "${BITCOIN_DB_URL}"
  node_table: "node_features"
  edge_table: "transaction_edges"
  label_space: "11"
  edge_chunk_size: 200000
  processed_data_path: "data/processed/protocols/class_balanced_khop.pt"

protocol:
  name: "class_balanced_khop"
  target_labels:
    - INDIVIDUAL
    - BET
    - GAMBLING
    - EXCHANGE
    - MINING
    - PONZI
    - RANSOMWARE
    - FAUCET
    - MARKETPLACE
    - MIXER
    - BRIDGE
  sampling:
    max_nodes: 700000
    max_neighbors_per_class: 30000
    max_neighbors_per_seed: 50
    seed_batch_size: 512
    background_nodes: 100000
    background_candidate_factor: 8
    background_window_attempts: 12
    degree_cap: 100000
    seed_degree_cap: 100000
    query_timeout_ms: 120000
    seed: 42

task:
  risk_group: "conservative_sensitive"

transform:
  clip_quantile: 0.995
  robust: false

split:
  type: "random_stratified"
  time_column: "last_transaction_in"
  val_ratio: 0.2
  test_ratio: 0.2
  seed: 42
