data:
  processed_data_path: "data/processed/data.pt"
  label_space: "5"
model:
  name: "mlp"
  params:
    hidden_channels: 128
    num_layers: 3
    dropout: 0.5
train:
  seed: 42
  device: "cpu"
  epochs: 300
  lr: 0.001
  weight_decay: 0.0005
  loss: "weighted_ce"
  class_weight_power: 1.0
  class_weight_cap: 10.0
  grad_clip_norm: 1.0
  early_stopping_patience: 50
  checkpoint_dir: "experiments/checkpoints/current_topk_mlp"
experiment:
  output_csv: "experiments/results/current_topk_mlp.csv"
