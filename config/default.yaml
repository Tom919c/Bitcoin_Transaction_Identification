data:
  raw_db: "postgresql://postgres:cq20050919;@localhost/bitcoin_db"  # 预处理阶段使用
  node_table: "node_features"                             # 节点表名
  edge_table: "transaction_edges"                         # 边表名
  processed_data_path: "D:\\Code\\VSCode\\Bitcoin_Transaction_Identification\\data\\processed\\data.pt"  # 供训练使用
  num_classes: 6
  label_map: "config/label_map.json"                      # 标签映射文件

preprocessing:
  target_labels: ["INDIVIDUAL", "BET", "GAMBLING", "EXCHANGE", "BRIDGE"]
  chunk_size: 50000    # 分块读取大小（节点/边）
  resume_enabled: true  # 默认启用断点续跑（有缓存即复用）
  checkpoint_dir: "./data/processed/checkpoints"  # 预处理阶段缓存目录
  force_recompute: false  # true 时忽略缓存并全量重算
  zscore_params:  # 论文公式11-13
    c: 6
    alpha: 0.3
    beta: 0.2
    gamma: 0.2
    theta: 0.3
  max_nodes: 350000  # 目标子图规模
  val_ratio: 0.2     # 从有标签节点中随机抽取验证集比例
  test_ratio: 0.2    # 从有标签节点中随机抽取测试集比例

model:
  name: "sage"  # 可选 mlp, gcn, gat, sage, res_sage, appnp
  params:
    hidden_channels: 128
    num_layers: 3
    dropout: 0.3

train:
  seed: 42
  device: "cpu"
  epochs: 300
  lr: 0.001
  weight_decay: 5e-4
  batch_size: 1024   # 仅用于mini-batch训练
  neighbor_sizes: [25, 10, 5]  # GraphSAGE采样邻居数
  loss: "weighted_ce"  # cross_entropy / weighted_ce / focal
  focal_gamma: 2.0 
  class_weight_power: 1.0
  class_weight_cap: 10.0
  grad_clip_norm: 1.0  # 0表示关闭梯度裁剪
  scheduler: "plateau"  # null / step / cosine / plateau
  scheduler_factor: 0.5
  scheduler_patience: 10
  early_stopping_patience: 50
  resume_from_checkpoint: null  # 断点续训路径，如 "./experiments/checkpoints/final_model.pt"
  checkpoint_dir: "./experiments/checkpoints"
  log_dir: "./experiments/logs"

wandb:
  enabled: true
  project: "bitcoin-transaction-identification"
  entity: 3538753476-uestc
  run_name: "sage_experiment"
  mode: "online"  # online / offline / disabled
  log_model: false
  watch_model: false

tuning:
  strategy: "random"  # random / grid
  max_trials: 30
  use_mini_batch: false  # 无 pyg-lib/torch-sparse 时建议关闭；脚本也会自动回退
  resume: true  # 中断后是否自动续跑（读取 progress_file）
  progress_file: null  # 默认自动使用 output_dir/sage_tuning_progress.json
  seed: 42            # 采样候选配置时使用
  seeds: [42, 3407]   # 每个候选配置的复现实验种子
  output_dir: "./experiments/tuning"
  space:
    hidden_channels: [64, 128, 256]
    dropout: [0.2, 0.3, 0.4]
    lr: [0.0005, 0.001, 0.002]
    weight_decay: [0.0001, 0.0005, 0.001]
    batch_size: [512, 1024, 2048]
    neighbor_sizes:
      - [15, 10, 5]
      - [25, 10, 5]
      - [30, 15, 10]
    loss: ["cross_entropy", "weighted_ce", "focal"]
    class_weight_power: [0.5, 1.0, 1.5]
    focal_gamma: [1.5, 2.0, 2.5]
    grad_clip_norm: [0.0, 1.0, 2.0]
    scheduler: ["plateau", "cosine"]
    early_stopping_patience: [30, 50, 80]

eval:
  macro_f1_average: "macro"
