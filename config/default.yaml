data:
  raw_db: "postgresql://user:pass@localhost/bitcoin_db" # 预处理阶段使用
  processed_data_path: "./data/data.pt" # 供训练使用
  num_classes: 6
  label_map: "config/label_map.json" # 标签映射文件

preprocessing:
  target_labels: ["INDIVIDUAL", "BET", "GAMBLING", "EXCHANGE", "BRIDGE"]
  zscore_params: # 论文公式11-13
    c: 6
    alpha: 0.3
    beta: 0.2
    gamma: 0.2
    theta: 0.3
  max_nodes: 350000 # 目标子图规模

model:
  name: "appnp" # 可选 mlp, gcn, gat, sage, res_sage, appnp
  params:
    hidden_channels: 256
    num_layers: 3
    dropout: 0.5
    # APPNP专用参数（仅当 model.name: "appnp" 时生效）
    K: 10
    alpha: 0.1

train:
  seed: 42
  device: "cuda"
  epochs: 200
  lr: 0.005
  weight_decay: 1e-3
  auto_rebuild_masks_on_load: true
  force_rebuild_masks_on_load: false
  min_train_samples_per_class: 80
  mask_train_ratio: 0.75
  mask_val_ratio: 0.1
  use_class_weights: true
  class_weight_strategy: "effective_num" # 可选: inverse, effective_num
  class_weight_beta: 0.9999
  class_weight_power: 0.8
  class_weight_overrides:
    BET: 1.1
    GAMBLING: 1.1
  loss_type: "cross_entropy" # 可选: cross_entropy, focal
  focal_gamma: 2.0
  appnp_full_batch_only: true
  load_best_at_end: true
  batch_size: 1024 # 仅用于mini-batch训练
  neighbor_sizes: [25, 10] # GraphSAGE采样邻居数
  early_stopping_patience: 50
  checkpoint_dir: "./experiments/checkpoints"
  log_dir: "./experiments/logs"

eval:
  metric_labels: ["INDIVIDUAL", "BET", "GAMBLING", "EXCHANGE", "BRIDGE"]
  macro_f1_average: "macro"
  minority_bias_tuning:
    enabled: true
    target_labels: ["BET", "GAMBLING"]
    objective: "macro_f1" # 可选: minority_macro_f1, minority_min_f1, minority_hmean_f1, macro_f1
    candidate_values: [-1.2, -1.0, -0.8, -0.6, -0.4, -0.2, 0.0]
